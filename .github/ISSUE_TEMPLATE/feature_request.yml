name: Feature request
description: A new feature or an improvement
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Please skim **Known limitations** and **Asset policy** in the README
        first. `RemoteViews` rules out animations, custom fonts, background
        blur, and arbitrary shape rendering, and team logos are out of scope
        for trademark reasons.

  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: Describe the situation you run into, not the feature itself.
      placeholder: "I only care about one team, but their match gets pushed off the widget."
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      placeholder: "Pick a team in the widget config; only that team's matches are listed."
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Optional.

  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: "This doesn't require anything `RemoteViews` forbids"
          required: true
        - label: "This doesn't add league or team logo imagery"
          required: true
