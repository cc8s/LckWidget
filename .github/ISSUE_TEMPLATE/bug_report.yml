name: Bug report
description: The widget or app behaves differently than expected
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Widget behavior depends heavily on the launcher and the manufacturer's
        battery policy, so please fill in the environment fields. Without them
        we usually cannot reproduce the issue.

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Describe both what you expected and what actually happened.
      placeholder: |
        Expected: the next three matches are listed
        Actual: only "예정된 경기가 없습니다" (no upcoming matches) is shown
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Add the widget at 4x2
        2. Turn the screen off and back on
        3. ...
    validations:
      required: true

  - type: input
    id: app-version
    attributes:
      label: App version
      placeholder: "1.0.0"
    validations:
      required: true

  - type: input
    id: device
    attributes:
      label: Device and Android version
      placeholder: "Galaxy S24, Android 15 (One UI 7)"
    validations:
      required: true

  - type: input
    id: launcher
    attributes:
      label: Launcher
      description: Just say "stock" if you use the one your device shipped with.
      placeholder: "One UI Home / Pixel Launcher / Nova"
    validations:
      required: true

  - type: dropdown
    id: when
    attributes:
      label: When does it happen?
      options:
        - Always
        - Only when offline
        - After some time has passed
        - Right after adding the widget
        - Not sure
    validations:
      required: true

  - type: textarea
    id: screenshot
    attributes:
      label: Screenshot
      description: A photo of the widget as it appears helps a lot.

  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Output of `adb logcat -s LCK`, if you can get it. Optional.
      render: shell
